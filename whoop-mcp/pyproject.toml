[project]
name = "whoop-mcp"
version = "0.1.0"
description = "MCP server that combines WHOOP energy data with a food log to track caloric deficit"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "uvicorn>=0.30",
    "tzdata",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
whoop-mcp = "whoop_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
